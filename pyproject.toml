[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semtree"
version = "0.1.0"
description = "Semantic Resolution Tree indexer — deterministic summary hierarchy for codebases"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastembed>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
semtree = "semtree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
