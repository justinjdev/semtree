[package]
name = "semtree"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
fastembed = "4"
tokio = { version = "1", features = ["full"] }
memmap2 = "0.9"
walkdir = "2"
glob = "0.3"
anyhow = "1"
tempfile = "3"
anthropic-sdk-rust = "0.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
futures = "0.3"

[dev-dependencies]
